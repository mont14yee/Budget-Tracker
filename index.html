<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Pro - Budget Management App</title>
    <meta name="description" content="Seamless Budget management and real-time tracking." />
    <meta property="og:title" content="Wallet Pro - Budget Management App" />
    <meta property="og:description" content="Seamless Budget management and real-time tracking." />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#166534">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Outfit', 'Noto Sans Ethiopic', 'Abyssinica SIL', sans-serif;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95) translateY(-10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-out forwards;
      }
      @keyframes clipReveal {
        0% {
          clip-path: circle(0% at var(--origin-x) var(--origin-y));
        }
        100% {
          clip-path: circle(150% at var(--origin-x) var(--origin-y));
        }
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-report-area, #printable-report-area * {
          visibility: visible;
        }
        #printable-report-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 1rem;
          box-shadow: none !important;
          border: none !important;
        }
        .no-print {
            display: none !important;
        }
      }
    </style>

</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
